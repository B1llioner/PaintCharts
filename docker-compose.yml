version: '3.8'

services:
  paintcharts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    image: paintcharts:latest
    container_name: paintcharts-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - COINGLASS_API_KEY=${COINGLASS_API_KEY:-57e6078b48cf4f2bb9a308fabde7a594}
      - COINGLASS_API_BASE=https://open-api-v4.coinglass.com/api
    restart: unless-stopped
    networks:
      - paintcharts-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Опциональный nginx для production
  nginx:
    image: nginx:alpine
    container_name: paintcharts-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/cache:/var/cache/nginx
    depends_on:
      - paintcharts
    networks:
      - paintcharts-network
    restart: unless-stopped
    profiles:
      - production

networks:
  paintcharts-network:
    driver: bridge
    name: paintcharts-network

volumes:
  nginx-cache:
    driver: local